coreKtx = "1.18.0"
coroutines = "1.11.0"
coroutines-test = "1.11.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
ksp = "2.3.7"
appcompat = "1.7.1"
koin = "4.2.1"
kotlinResult = "2.3.1"
room = "2.8.4"
material = "1.14.0"
